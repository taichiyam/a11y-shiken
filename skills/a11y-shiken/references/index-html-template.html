<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アクセシビリティテスト レポート</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js" integrity="sha384-qSFej5dZNviyoPgYJ5+Xk4bEbX8AYddxAHPuzs1aSgRiXxJ3qmyWNaPsRkpv/+x5" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1f2328;
      background: #fff;
      display: flex;
      height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: #f6f8fa;
      border-right: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 14px;
      font-weight: 600;
      padding: 16px 16px 8px;
      color: #656d76;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar nav a {
      display: block;
      padding: 8px 16px;
      color: #1f2328;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .sidebar nav a:hover {
      background: #eaeef2;
    }

    .sidebar nav a.active {
      background: #ddf4ff;
      border-left-color: #0969da;
      font-weight: 600;
      color: #0969da;
    }

    .sidebar nav a.summary-link {
      font-weight: 600;
      border-bottom: 1px solid #d0d7de;
      padding: 12px 16px;
    }

    /* --- Main content --- */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
    }

    /* --- Markdown rendering (GitHub-like) --- */
    .main h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #d0d7de; margin: 0 0 16px; }
    .main h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #d0d7de; margin: 24px 0 16px; }
    .main h3 { font-size: 1.25em; margin: 24px 0 16px; }
    .main p { margin: 0 0 16px; line-height: 1.6; }
    .main ul, .main ol { margin: 0 0 16px; padding-left: 2em; }
    .main li { margin: 4px 0; line-height: 1.6; }
    .main blockquote {
      padding: 0 1em;
      color: #656d76;
      border-left: 0.25em solid #d0d7de;
      margin: 0 0 16px;
    }
    .main code {
      background: #eff1f3;
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 85%;
    }
    .main pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 16px;
    }
    .main pre code { background: none; padding: 0; }
    .main table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 16px;
    }
    .main th, .main td {
      border: 1px solid #d0d7de;
      padding: 6px 13px;
      text-align: left;
    }
    .main th { background: #f6f8fa; font-weight: 600; }
    .main tr:nth-child(even) { background: #f6f8fa; }
    .main hr { border: none; border-top: 1px solid #d0d7de; margin: 24px 0; }

    /* --- Loading --- */
    .loading {
      color: #656d76;
      padding: 48px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h1>レポート</h1>
  <nav id="nav"></nav>
</div>

<div class="main" id="content">
  <div class="loading">読み込み中...</div>
</div>

<script>
  // --- Configuration ---
  // This array is populated by the skill when generating index.html.
  // Each entry: { label: "display name", file: "relative path to .md" }
  const pages = [
    // __PAGES_PLACEHOLDER__
  ];

  const nav = document.getElementById('nav');
  const content = document.getElementById('content');

  // Map from each page's resolved absolute path to its index, used to route
  // relative .md links found *inside* rendered Markdown (e.g. "./TOP.md")
  // back to loadPage() instead of letting the browser navigate to a URL
  // resolved against index.html's own location (which is the wrong base and
  // 404s, since the .md files actually live under markdown/).
  const pageByPath = new Map();
  let currentDir = '';

  // Build sidebar
  pages.forEach((page, i) => {
    pageByPath.set(new URL(page.file, location.href).pathname, i);

    const a = document.createElement('a');
    a.href = '#';
    a.textContent = page.label;
    a.dataset.index = i;
    if (page.file.includes('_index.md')) {
      a.classList.add('summary-link');
    }
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadPage(i);
    });
    nav.appendChild(a);
  });

  // Intercept clicks on relative .md links inside the rendered content and
  // route them to loadPage() when they match a known page. External links,
  // anchors, and links to files outside the sidebar navigate normally.
  content.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || /^([a-z][a-z0-9+.-]*:|#)/i.test(href)) return;

    let resolvedPath;
    try {
      resolvedPath = new URL(href, new URL(currentDir, location.href)).pathname;
    } catch (err) {
      return;
    }

    const targetIndex = pageByPath.get(resolvedPath);
    if (targetIndex !== undefined) {
      e.preventDefault();
      loadPage(targetIndex);
    }
  });

  async function loadPage(index) {
    // Update active state
    nav.querySelectorAll('a').forEach(a => a.classList.remove('active'));
    nav.querySelector(`a[data-index="${index}"]`).classList.add('active');

    const page = pages[index];
    currentDir = page.file.replace(/[^/]*$/, '');
    try {
      const res = await fetch(page.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const md = await res.text();
      // Render markdown and sanitize to prevent XSS
      const rawHtml = marked.parse(md);
      content.textContent = '';
      const sanitized = DOMPurify.sanitize(rawHtml);
      const wrapper = document.createElement('div');
      wrapper.insertAdjacentHTML('afterbegin', sanitized);
      content.appendChild(wrapper);
    } catch (e) {
      content.textContent = '';
      const errP = document.createElement('p');
      errP.style.color = '#cf222e';
      errP.textContent = 'ファイルの読み込みに失敗しました: ' + page.file + ' — ' + e.message;
      content.appendChild(errP);
    }
  }

  // Load first page on start
  if (pages.length > 0) {
    loadPage(0);
  } else {
    content.textContent = 'ページが見つかりません。';
  }
</script>

</body>
</html>
