name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: skills/a11y-shiken/scripts
        run: bun install
      - name: Run tests
        working-directory: skills/a11y-shiken/scripts
        run: bun test
      - name: Type check
        working-directory: skills/a11y-shiken/scripts
        run: bunx tsc --noEmit
