  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1f2328;
      background: #fff;
      display: flex;
      height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: #f6f8fa;
      border-right: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 14px;
      font-weight: 600;
      padding: 16px 16px 8px;
      color: #656d76;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar nav a {
      display: block;
      padding: 8px 16px;
      color: #1f2328;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .sidebar nav a:hover {
      background: #eaeef2;
    }

    .sidebar nav a.active {
      background: #ddf4ff;
      border-left-color: #0969da;
      font-weight: 600;
      color: #0969da;
    }

    .sidebar nav a.summary-link {
      font-weight: 600;
      border-bottom: 1px solid #d0d7de;
      padding: 12px 16px;
    }

    /* --- Main content --- */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
    }

    /* --- Markdown rendering (GitHub-like) --- */
    .main h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #d0d7de; margin: 0 0 16px; }
    .main h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #d0d7de; margin: 24px 0 16px; }
    .main h3 { font-size: 1.25em; margin: 24px 0 16px; }
    .main p { margin: 0 0 16px; line-height: 1.6; }
    .main ul, .main ol { margin: 0 0 16px; padding-left: 2em; }
    .main li { margin: 4px 0; line-height: 1.6; }
    .main blockquote {
      padding: 0 1em;
      color: #656d76;
      border-left: 0.25em solid #d0d7de;
      margin: 0 0 16px;
    }
    .main code {
      background: #eff1f3;
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 85%;
    }
    .main pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 16px;
    }
    .main pre code { background: none; padding: 0; }
    .main table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 16px;
    }
    .main th, .main td {
      border: 1px solid #d0d7de;
      padding: 6px 13px;
      text-align: left;
    }
    .main th { background: #f6f8fa; font-weight: 600; }
    .main tr:nth-child(even) { background: #f6f8fa; }
    .main hr { border: none; border-top: 1px solid #d0d7de; margin: 24px 0; }

    /* --- Loading --- */
    .loading {
      color: #656d76;
      padding: 48px;
      text-align: center;
    }
  </style>
</head>

| 4 | 自動でコンテンツを切り替えない | ✅ 確認OK | 1基準中 確認 1 |\n\n## 必須（13項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 5 | 画像に代替テキストを付与する | ✅ 確認OK | 1基準中 確認 1 |\n| 6 | キーボードだけで全機能にアクセスできる | ⚠️ 一部未確認 | 5基準中 確認 3 / 未確認 2 |\n| 7 | 操作に制限時間を設けない | ✅ 確認OK | 2基準中 確認 2 |\n| 8 | 単一の表現だけで情報を伝えない | ✅ 確認OK | 3基準中 確認 3 |\n| 9 | 読み上げ順序が意味の通る順になっている | ⚠️ 一部未確認 | 3基準中 確認 2 / 未確認 1 |\n| 10 | 見出し要素でセクションを表現する | ✅ 確認OK | 4基準中 確認 3 / 対象外 1 |\n| 11 | 文字と背景に十分なコントラスト比 | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 12 | 拡大縮小しても情報が読み取れる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 13 | 文字・文字コード・フォントの注意 | ✅ 確認OK | 3基準中 確認 2 / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 15 | リンクを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ok/index.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 14 個のうち 15 個（107%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ok/index.html に `\u003Cvideo>` 要素がなく、style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 適合 | 自動判定(Claude) | 主要画像に内容を説明する代替テキストがあり、装飾SVGは支援技術から隠されている; 証拠: ツリー `- img \"つばめ台コミュニティセンターの外観。本館と別館の2棟の建物があり、前庭には木と花壇がある\"` / HTML の検索・SNS アイコンは `\u003Csvg aria-hidden=\"true\" focusable=\"false\">` |\n\n### 6. キーボードだけで全機能にアクセスできる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 適合 | 自動判定(Claude) | 操作要素はネイティブの a / button / input / select のみで、独自のクリックハンドラを持つ要素がない; 証拠: ok/index.html に `\u003Cscript>` 要素・`onclick` 属性が存在せず、ツリーの操作要素は `- link` / `- button \"検索\"` / `- searchbox \"サイト内検索\"` のみ |\n| 2.4.3 フォーカス順序 | 目視確認 | 要目視確認 |  |\n| 2.4.7 フォーカスの可視化 | 目視確認 | 要目視確認 |  |\n| 3.2.1 フォーカス時 | 適合 | 自動判定(Interactive) | 証拠: 10個の要素でフォーカス前後の URL・DOM に変化がないことを確認しました。 |\n| 3.2.2 入力時 | 適合 | 自動判定(Interactive) | 証拠: 1個のフォームフィールド（テキスト入力・select・checkbox / radio）で値の入力・変更前後の URL・DOM に変化がないことを確認しました。 |\n\n### 7. 操作に制限時間を設けない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.1 タイミング調整可能 | 適合 | 自動判定(Claude) | 制限時間のあるコンテンツがない; 証拠: ok/index.html に `\u003Cmeta http-equiv=\"refresh\">` も `\u003Cscript>` も存在しない |\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 8. 単一の表現だけで情報を伝えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | 見出し階層が h1→h2→h3 の順で飛びがなく、リスト・フォームラベルもマークアップで関連付けられている; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` → `- heading \"お知らせ\" [level=2]` → `- heading \"部屋を予約する\" [level=3]`、HTML `\u003Clabel class=\"visually-hidden\" for=\"site-search\">` と `\u003Cinput type=\"search\" id=\"site-search\">` |\n| 1.3.3 感覚的な特徴 | 適合 | 自動判定(Claude) | 形状・位置・音などの感覚的特徴のみに依存した説明文がない; 証拠: 本文テキスト（`- paragraph: 地域のみなさんの学びと交流の拠点です。` 以下すべて）に「右のボタン」「丸いアイコン」等の感覚依存の指示が含まれない |\n| 1.4.1 色の使用 | 適合 | 自動判定(Claude) | 本文リンクは下線で区別されており、色のみで情報を伝えている箇所がない; 証拠: style.css `.content a { color: #1d4ed8; text-decoration: underline; }` |\n\n### 9. 読み上げ順序が意味の通る順になっている — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | 見出し階層が h1→h2→h3 の順で飛びがなく、リスト・フォームラベルもマークアップで関連付けられている; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` → `- heading \"お知らせ\" [level=2]` → `- heading \"部屋を予約する\" [level=3]`、HTML `\u003Clabel class=\"visually-hidden\" for=\"site-search\">` と `\u003Cinput type=\"search\" id=\"site-search\">` |\n| 1.3.2 意味のある順序 | 適合 | 自動判定(Claude) | DOM順（スキップリンク→ヘッダー→ナビ→main→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- link \"本文へスキップ\"` → `- banner:` → `- navigation:` → `- main:` → `- contentinfo:` の順に並ぶ |\n| 2.4.3 フォーカス順序 | 目視確認 | 要目視確認 |  |\n\n### 10. 見出し要素でセクションを表現する — ✅ 確認OK\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | 見出し階層が h1→h2→h3 の順で飛びがなく、リスト・フォームラベルもマークアップで関連付けられている; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` → `- heading \"お知らせ\" [level=2]` → `- heading \"部屋を予約する\" [level=3]`、HTML `\u003Clabel class=\"visually-hidden\" for=\"site-search\">` と `\u003Cinput type=\"search\" id=\"site-search\">` |\n| 2.4.6 見出し及びラベル | 適合 | 自動判定(Claude) | 見出しとラベルが内容を説明している; 証拠: ツリー `- heading \"お知らせ\" [level=2]` / `- heading \"部屋を予約する\" [level=3]` / `- searchbox \"サイト内検索\"` |\n| 2.4.1 ブロックスキップ | 適合 | 自動判定(Claude) | 本文へのスキップリンクとランドマークが用意されている; 証拠: ツリー `- link \"本文へスキップ\": /url: \"#main\"` と `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` |\n| 2.4.10 | — | 判定対象外 | Level AAA のため A+AA の判定対象外 |\n\n### 11. 文字と背景に十分なコントラスト比 — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.3 コントラスト（最低限） | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（color-contrast）。この pass だけでは適合と判定していません |\n\n### 12. 拡大縮小しても情報が読み取れる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.4 テキストのサイズ変更 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（meta-viewport）。この pass だけでは適合と判定していません |\n\n### 13. 文字・文字コード・フォントの注意 — ✅ 確認OK\n\n> 4.1.1（構文解析）は WCAG 2.2 で廃止されたため判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.3.2 ラベル又は説明 | 適合 | 自動判定(Claude) | 入力欄にラベルが関連付けられている; 証拠: HTML `\u003Clabel class=\"visually-hidden\" for=\"site-search\">サイト内検索\u003C/label>` + `\u003Cinput id=\"site-search\">`、ツリー `- searchbox \"サイト内検索\"` |\n| 4.1.1 | — | 判定対象外 | WCAG 2.2 で廃止 |\n| 4.1.2 名前（name）、役割（role）及び値（value） | 適合 | 自動判定(Claude) | すべての操作要素がネイティブ要素で、ツリー上に役割と名前が現れている; 証拠: ツリー `- searchbox \"サイト内検索\"` / `- button \"検索\"` / `- link \"トップ\"`（名前のない操作要素なし） |\n\n### 14. ページタイトルを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.2 ページタイトル | 適合 | 自動判定(Claude) | ページの内容を説明するタイトルが設定されている; 証拠: HTML `\u003Ctitle>トップページ \\| つばめ台コミュニティセンター\u003C/title>` |\n\n### 15. リンクを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.4 リンクの目的（コンテキスト内） | 適合 | 自動判定(Claude) | すべてのリンクがリンクテキスト単独で目的を判別できる; 証拠: ツリー `- link \"夏休みこども工作教室（8月23日開催）の参加申し込みを受付中です\"` / `- link \"貸室の一覧と利用料金を見る\"` / `- link \"つばめ台コミュニティセンター公式SNSアカウント\"`（「こちら」等の曖昧なリンクテキストなし） |\n\n### 16. ナビゲーションに一貫性をもたせる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.3 一貫したナビゲーション | 目視確認 | 要目視確認 |  |\n\n### 17. 同じ機能には同じラベルをつける — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.4 一貫した識別性 | 目視確認 | 要目視確認 |  |\n\n---\n\n出典: デジタル庁『ウェブアクセシビリティ導入ガイドブック』2024-03-29版 §3.1・§3.2\nhttps://www.digital.go.jp/resources/introduction-to-web-accessibility-guidebook\n\n本ツールはデジタル庁・WAIC・W3C・JISC の認証や推奨を受けたものではありません。","./markdown/ok-施設案内.md":"# ページ: ok-施設案内\n\n| 項目 | 値 |\n|------|-----|\n| 対象URL | http://127.0.0.1:8765/ok/facility.html |\n| テスト日時 | 2026-08-21 02:09 |\n| 対象基準 | WCAG 2.2 Level AA |\n| テストツール | axe-core + Playwright（自動判定）、Claude 分析（自動判定(Claude)） |\n\n> **凡例**\n> - **自動判定**: axe-core による自動テスト結果\n> - **自動判定(Visual)**: Playwright Visual テスト結果\n> - **自動判定(Interactive)**: Playwright Interactive テスト結果\n> - **自動判定(Claude)**: アクセシビリティツリー（またはHTML）を分析して判定した結果\n> - **要目視確認**: ブラウザ操作が必要なため、人による目視確認が必要\n\n## サマリー\n\n| カテゴリ | 件数 |\n|---------|------|\n| 🔴 修正あり | 0件 |\n| ✅ 確認OK | 46件 |\n| ⚠️ 未確認 | 9件 |\n\n---\n\n## チェック項目\n\n| No. | カテゴリ | チェック項目 | レベル | 確認内容 | 担当 | 結果 | 備考 |\n|-----|---------|------------|--------|---------|------|------|------|\n| 1 | 知覚可能 | 1.1.1 非テキストコンテンツ | A | img要素のalt属性の有無、alt値が適切か、装飾画像にalt=\"\"が設定されているか | 自動 未確認 1 |\n| 12 | 拡大縮小しても情報が読み取れる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 13 | 文字・文字コード・フォントの注意 | ✅ 確認OK | 3基準中 確認 2 / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 15 | リンクを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ok/facility.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 8 個のうち 9 個（113%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ok/facility.html に `\u003Cvideo>` 要素がなく、style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 適合 | 自動判定(Claude) | ギャラリーの3枚の画像すべてに内容を説明する代替テキストがある; 証拠: ツリー `- img \"多目的ホールの内観。ステージの前に椅子が並んでいる\"` / `- img \"音楽スタジオの内観。ピアノと譜面台が置かれている\"` / `- img \"調理実習室の内観。調理台とコンロ、吊り棚がある\"` |\n\n### 6. キーボードだけで全機能にアクセスできる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 適合 | 自動判定(Claude) | 操作要素はネイティブの a / button / input のみで、独自のクリックハンドラを持つ要素がない; 証拠: ok/facility.html に `\u003Cscript>` 要素・`onclick` 属性が存在せず、ツリーの操作要素は `- link` / `- button \"検索\"` / `- searchbox \"サイト内検索\"` のみ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 8個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n| 2.4.7 フォーカスの可視化 | 目視確認 | 要目視確認 |  |\n| 3.2.1 フォーカス時 | 適合 | 自動判定(Interactive) | 証拠: 8個の要素でフォーカス前後の URL・DOM に変化がないことを確認しました。 |\n| 3.2.2 入力時 | 適合 | 自動判定(Interactive) | 証拠: 1個のフォームフィールド（テキスト入力・select・checkbox / radio）で値の入力・変更前後の URL・DOM に変化がないことを確認しました。 |\n\n### 7. 操作に制限時間を設けない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.1 タイミング調整可能 | 適合 | 自動判定(Claude) | 制限時間のあるコンテンツがない; 証拠: ok/facility.html に `\u003Cmeta http-equiv=\"refresh\">` も `\u003Cscript>` も存在しない |\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 8. 単一の表現だけで情報を伝えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | 見出し階層が h1→h2 で飛びがなく、表は caption と見出しセルで行・列の関係が伝わる; 証拠: ツリー `- table \"貸室一覧（定員・利用料金・主な設備）\":` 配下に `- columnheader \"部屋名\"` と `- rowheader \"多目的ホール\"`、HTML `\u003Cth scope=\"col\">` / `\u003Cth scope=\"row\">` |\n| 1.3.3 感覚的な特徴 | 適合 | 自動判定(Claude) | 形状・位置・音などの感覚的特徴のみに依存した説明文がない; 証拠: 本文テキスト（`- paragraph: 予約は利用日の3か月前から、窓口または電話で受け付けています。` 等）に「右の表」「丸いアイコン」等の感覚依存の指示が含まれない |\n| 1.4.1 色の使用 | 適合 | 自動判定(Claude) | 本文リンクは下線で区別されており、表の情報も文字で読み取れる; 証拠: style.css `.content a { color: #1d4ed8; text-decoration: underline; }`、表のセルは `- cell \"1,200円\"` のように文字で値を持つ |\n\n### 9. 読み上げ順序が意味の通る順になっている — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | 見出し階層が h1→h2 で飛びがなく、表は caption と見出しセルで行・列の関係が伝わる; 証拠: ツリー `- table \"貸室一覧（定員・利用料金・主な設備）\":` 配下に `- columnheader \"部屋名\"` と `- rowheader \"多目的ホール\"`、HTML `\u003Cth scope=\"col\">` / `\u003Cth scope=\"row\">` |\n| 1.3.2 意味のある順序 | 適合 | 自動判定(Claude) | DOM順（スキップリンク→ヘッダー→ナビ→main→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- link \"本文へスキップ\"` → `- banner:` → `- navigation:` → `- main:` → `- contentinfo:` の順に並ぶ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 8個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n\n### 10. 見出し要素でセクションを表現する — ✅ 確認OK\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | \"` / `- button \"送信する\"`（名前のない操作要素なし） |\n| 55 | 堅牢 | 4.1.3 ステータスメッセージ | AA | 成功/エラー/進行状況等のステータスメッセージがrole=\"status\"やaria-liveで支援技術に伝わるか | 自動判定(Claude) | 確認OK | 動的に更新されるステータスメッセージがない; 証拠: ok/contact.html に `\u003Cscript>` 要素・`aria-live` / `role=\"status\"` / `role=\"alert\"` 属性が存在しない |\n\n---\n\n## 修正が必要な項目の詳細\n\n修正が必要な項目はありません。\n\n---\n\n## 対応優先度まとめ\n\n修正が必要な項目はありません。\n","./markdown/ok-お問い合わせ-baseline-17.md":"# 基本17項目チェック（デジタル庁ガイドブック）\n\n対象: http://127.0.0.1:8765/ok/contact.html\n実行日時: 2026-08-21 02:09\n\n> WCAG 2.2 Level A+AA の55項目の判定結果を、デジタル庁『ウェブアクセシビリティ導入ガイドブック』の\n> **基本17項目（重大4＋必須13）** に集約したものです。\n> **⚠️ この結果は正式なアクセシビリティ試験（JIS X 8341-3:2016）の代替にはなりません。**\n\n## サマリー\n\n| | 件数 |\n|---|---|\n| ❌ 要修正 | 0 |\n| ⚠️ 一部未確認（目視が必要な基準が残っている） | 5 |\n| ✅ 確認OK | 12 |\n| — 判定対象外 | 0 |\n\n## 重大（4項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 1 | 自動再生はさせない | ✅ 確認OK | 1基準中 確認 1 |\n| 2 | 袋小路に陥らせない（キーボードトラップ） | ✅ 確認OK | 1基準中 確認 1 |\n| 3 | 光の点滅は危険 | ✅ 確認OK | 1基準中 確認 1 |\n| 4 | 自動でコンテンツを切り替えない | ✅ 確認OK | 1基準中 確認 1 |\n\n## 必須（13項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 5 | 画像に代替テキストを付与する | ✅ 確認OK | 1基準中 確認 1 |\n| 6 | キーボードだけで全機能にアクセスできる | ⚠️ 一部未確認 | 5基準中 確認 4 / 未確認 1 |\n| 7 | 操作に制限時間を設けない | ✅ 確認OK | 2基準中 確認 2 |\n| 8 | 単一の表現だけで情報を伝えない | ✅ 確認OK | 3基準中 確認 3 |\n| 9 | 読み上げ順序が意味の通る順になっている | ✅ 確認OK | 3基準中 確認 3 |\n| 10 | 見出し要素でセクションを表現する | ✅ 確認OK | 4基準中 確認 3 / 対象外 1 |\n| 11 | 文字と背景に十分なコントラスト比 | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 12 | 拡大縮小しても情報が読み取れる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 13 | 文字・文字コード・フォントの注意 | ✅ 確認OK | 3基準中 確認 2 / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 15 | リンクを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ok/contact.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 14 個のうち 15 個（107%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ok/contact.html に `\u003Cvideo>` 要素がなく、style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 適合 | 自動判定(Claude) | 意味を持つ画像がなく、装飾SVGは支援技術から隠されている; 証拠: ok/contact.html の画像は検索ボタン内の `\u003Csvg aria-hidden=\"true\" focusable=\"false\">` のみで、`\u003Cimg>` 要素は存在しない |\n\n### 6. キーボードだけで全機能にアクセスできる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 適合 | 自動判定(Claude) | 操作要素はネイティブの a / button / input / select / textarea のみで、独自のクリックハンドラを持つ要素がない; 証拠: ok/contact.html に `\u003Cscript>` 要素・`onclick` 属性が存在せず、ツリーの操作要素は `- textbox` / `- combobox` / `- checkbox` / `- button \"送信する\"` / `- link` のみ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 14個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n| 2.4.7 フォーカスの可視化 | 目視確認 | 要目視確認 |  |\n| 3.2.1 フォーカス時 | 適合 | 自動判定(Interactive) | 証拠: 10個の要素でフォーカス前後の URL・DOM に変化がないことを確認しました。 |\n| 3.2.2 入力時 | 適合 | 自動判定(Interactive) | 証拠: 5個のフォームフィールド（テキスト入力・select・checkbox / radio）で値の入力・変更前後の URL・DOM に変化がないことを確認しました。 |\n\n### 7. 操作に制限時間を設けない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.1 タイミング調整可能 | 適合 | 自動判定(Claude) | 制限時間のあるコンテンツがない; 証拠: ok/contact.html に `\u003Cmeta http-equiv=\"refresh\">` も `\u003Cscript>` も存在しない |\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 8. 単一の表現だけで情報を伝えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | すべての入力欄が label 要素と for/id で関連付けられ、ツリー上でも名前が解決されている; 証拠: ツリー `- textbox \"お名前（必須）\"` / `- combobox \"お問い合わせの種類（必須）\"` / `- checkbox \"個人情報の取り扱いに同意する（必須）\"`、HTML `\u003Clabel for=\"name\">お名前（必須）\u003C/label>` + `\u003Cinput type=\"text\" id=\"name\">` |\n| 1.3.3 感覚的な特徴 | 適合 | 自動判定(Claude) | 形状・位置・色などの感覚的特徴のみに依存した説明文がない; 証拠: 入力の指示は `- paragraph: 「（必須）」と書かれた項目は必ず入力してください。` とテキストで示されている |\n| 1.4.1 色の使用 | 適合 | 自動判定(Claude) | 必須項目はラベル内の「（必須）」というテキストで示されており、色のみに依存していない; 証拠: ツリー `- textbox \"お名前（必須）\"` と `- paragraph: 「（必須）」と書かれた項目は必ず入力してください。` |\n\n### 9. 読み上げ順序が意味の通る順になっている — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | すべての入力欄が label 要素と for/id で関連付けられ、ツリー上でも名前が解決されている; 証拠: ツリー `- textbox \"お名前（必須）\"` / `- combobox \"お問い合わせの種類（必須）\"` / `- checkbox \"個人情報の取り扱いに同意する（必須）\"`、HTML `\u003Clabel for=\"name\">お名前（必須）\u003C/label>` + `\u003Cinput type=\"text\" id=\"name\">` |\n| 1.3.2 意味のある順序 | 適合 | 自動判定(Claude) | DOM順（スキップリンク→ヘッダー→ナビ→main→フッター、フォームは上から下へ）が視覚的な提示順と一致している; 証拠: ツリーが `- link \"本文へスキップ\"` → `- banner:` → `- navigation:` → `- main:` → `- contentinfo:` の順に並び、フォームは `- textbox \"お名前（必須）\"` → `- textbox \"メールアドレス（必須）\"` → … → `- button \"送信する\"` の順 |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 14個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n\n### 10. 見出し要素でセクションを表現する — ✅ 確認OK\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 適合 | 自動判定(Claude) | すべての入力欄が label 要素と for/id で関連付けられ、ツリー上でも名前が解決されている; 証拠: ツリー `- textbox \"お名前（必須）\"` / `- combobox \"お問い合わせの種類（必須）\"` / `- checkbox \"個人情報の取り扱いに同意する（必須）\"`、HTML `\u003Clabel for=\"name\">お名前（必須）\u003C/label>` + `\u003Cinput type=\"text\" id=\"name\">` |\n| 2.4.6 見出し及びラベル | 適合 | 自動判定(Claude) | 見出しとフォームのラベルが内容を説明し、必須の有無も示している; 証拠: ツリー `- heading \"お問い合わせ\" [level=1]` / `- textbox \"メールアドレス（必須）\"` / `- textbox \"電話番号（任意）\"` |\n| 2.4.1 ブロックスキップ | 適合 | 自動判定(Claude) | 本文へのスキップリンクとランドマークが用意されている; 証拠: ツリー `- link \"本文へスキップ\": /url: \"#main\"` と `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` |\n| 2.4.10 | — | 判定対象外 | Level AAA のため A+AA の判定対象外 |\n\n### 11. 文字と背景に十分なコントラスト比 — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.3 コントラスト（最低限） | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（color-contrast）。この pass だけでは適合と判定していません |\n\n### 12. 拡大縮小しても情報が読み取れる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.4 テキストのサイズ変更 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（meta-viewport）。この pass だけでは適合と判定していません |\n\n### 13. 文字・文字コード・フォントの注意 — ✅ 確認OK\n\n> 4.1.1（構文解析）は WCAG 2.2 で廃止されたため判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.3.2 ラベル又は説明 | 適合 | 自動判定(Claude) | すべての入力欄に可視ラベルがあり、必須項目の説明もテキストで提示されている; 証拠: HTML `\u003Clabel for=\"name\">お名前（必須）\u003C/label>` / `\u003Clabel for=\"subject\">お問い合わせの種類（必須）\u003C/label>` / `\u003Clabel for=\"agree\">個人情報の取り扱いに同意する（必須）\u003C/label>` と `\u003Cp>「（必須）」と書かれた項目は必ず入力してください。\u003C/p>` |\n| 4.1.1 | — | 判定対象外 | WCAG 2.2 で廃止 |\n| 4.1.2 名前（name）、役割（role）及び値（value） | 適合 | 自動判定(Claude) | すべてのフォーム部品がネイティブ要素で、ツリー上に役割と名前が現れている; 証拠: ツリー `- textbox \"お名前（必須）\"` / `- combobox \"お問い合わせの種類（必須）\"` / `- checkbox \"個人情報の取り扱いに同意する（必須）\"` / `- button \"送信する\"`（名前のない操作要素なし） |\n\n### 14. ページタイトルを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.2 ページタイトル | 適合 | 自動判定(Claude) | ページの内容を説明するタイトルが設定されている; 証拠: HTML `\u003Ctitle>お問い合わせ \\| つばめ台コミュニティセンター\u003C/title>` |\n\n### 15. リンクを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.4 リンクの目的（コンテキスト内） | 適合 | 自動判定(Claude) | リンクテキスト単独で目的を判別できる; 証拠: ツリー `- link \"トップ\"` / `- link \"施設案内\"` / `- link \"つばめ台コミュニティセンター\"`（「こちら」等の曖昧なリンクテキストなし） |\n\n### 16. ナビゲーションに一貫性をもたせる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.3 一貫したナビゲーション | 目視確認 | 要目視確認 |  |\n\n### 17. 同じ機能には同じラベルをつける — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.4 一貫した識別性 | 目視確認 | 要目視確認 |  |\n\n---\n\n出典: デジタル庁『ウェブアクセシビリティ導入ガイドブック』2024-03-29版 §3.1・§3.2\nhttps://www.digital.go.jp/resources/introduction-to-web-accessibility-guidebook\n\n本ツールはデジタル庁・WAIC・W3C・JISC の認証や推奨を受けたものではありません。","./markdown/ng-TOP.md":"# ページ: ng-TOP\n\n| 項目 | 値 |\n|------|-----|\n| 対象URL | http://127.0.0.1:8765/ng/index.html |\n| テスト日時 | 2026-08-21 02:09 |\n| 対象基準 | WCAG 2.2 Level AA |\n| テストツール | axe-core + Playwright（自動判定）、Claude 分析（自動判定(Claude)） |\n\n> **凡例**\n> - **自動判定**: axe-core による自動テスト結果\n> - **自動判定(Visual)**: Playwright Visual テスト結果\n> - **自動判定(Interactive)**: Playwright Interactive テスト結果\n> - **自動判定(Claude)**: アクセシビリティツリー（またはHTML）を分析して判定した結果\n> - **要目視確認**: ブラウザ操作が必要なため、人による目視確認が必要\n\n## サマリー\n\n| カテゴリ | 件数 |\n|---------|------|\n| 🔴 修正あり | 9件 |\n| ✅ 確認OK | 35件 |\n| ⚠️ 未確認 | 11件 |\n\n---\n\n## チェック項目\n\n| No. | カテゴリ | チェック項目 | レベル | 確認内容 | 担当 | 結果 | 備考 |\n|-----|---------|------------|--------|---------|------|------|------|\n| 1 | 知覚可能 | 1.1.1 非テキストコンテンツ | A | img要素のalt属性の有無、alt値が適切か、装飾画像にalt=\"\"が設定されているか | 自動判定(Claude) | 修正あり | 主要画像の代替テキストが「画像」で、画像が伝えている内容を説明していない; 証拠: HTML `\u003Cimg src=\"../assets/hero.svg\" alt=\"画像\">`、ツリー `- img \"画像\"` |\n| 2 | 知覚可能 | 1.2.1 音声のみ及び映像のみ（収録済） | A | 音声のみ/映像のみのコンテンツに代替テキストまたは代替メディアが提供されているか | 自動判定(Claude) | 確認OK | 音声・映像コンテンツなし; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` / `\u003Ciframe>` 要素が存在しない |\n| 3 | 知覚可能 | 1.2.2 キャプション（収録済） | A | 収録済み映像に正確なキャプション（字幕）が付与されているか | 自動判定(Claude) | 確認OK | 音声・映像コンテンツなし; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` / `\u003Ciframe>` 要素が存在しない |\n| 4 | 知覚可能 | 1.2.3 音声解説又はメディアに対する代替（収録済） | A | 映像コンテンツに音声解説またはテキストによる代替が提供されているか | 自動判定(Claude) | 確認OK | 音声・映像コンテンツなし; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` / `\u003Ciframe>` 要素が存在しない |\n| 5 | 知覚可能 | 1.2.4 キャプション（ライブ） | AA | ライブ映像にリアルタイムのキャプションが提供されているか | 自動判定(Claude) | 確認OK | ライブ音声・映像コンテンツなし; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` / `\u003Ciframe>` 要素が存在しない |\n| 6 | 知覚可能 | 1.2.5 音声解説（収録済） | AA | 収録済み映像に音声解説が提供されているか | 自動判定(Claude) | 確認OK | 音声・映像コンテンツなし; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` / `\u003Ciframe>` 要素が存在しない |\n| 7 | 知覚可能 | 1.3.1 情報及び関係性 | A | 見出し構造（h1-h6）の妥当性、フォーム要素のラベル紐付け、テーブルのth/caption | 自動判定(Claude) | 修正あり | 見出しレベルが h1 の次に h3 へ飛んでおり、見出しの階層関係がマークアップから正しく伝わらない; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` の次の見出しが `- heading \"お知らせ\" [level=3]`（h2 が存在しない）。HTML も `\u003Ch1>` → `\u003Ch3 class=\"section-title\">お知らせ\u003C/h3>` → `\u003Ch4 class=\"card-title\">` |\n| 8 | 知覚可能 | 1.3.2 意味のある順序 | A | DOMの順序が視覚的な表示順序と一致しているか。CSSで位置変更した場合に読み上げ順序が意味を保つか | 自動判定(Claude) | 確認OK | DOM順（ヘッダー→ナビ→本文→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- paragraph: - link \"つばめ台コミュニティセンター\"` → `- searchbox \"サイト内検索\"` → ナビの `- list:` → `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` → フッターの `- paragraph: \"つばめ台コミュニティセンター 〒000-0000 …\"` の順に並ぶ |\n| 9 | 知覚可能 | 1.3.3 感覚的な特徴 | A | 色・形・位置のみで情報を伝えていないか（例：「赤いボタンを押してください」） | 自動判定(Claude) | 確認OK | 形状・位置・音などの感覚的特徴のみに依存した説明文がない; 証拠: 本文テキスト（`- paragraph: 地域のみなさんの学びと交流の拠点です。` 以下すべて）に「右のボタン」「丸いアイコン」等の感覚依存の指示が含まれない |\n| 10 | 知覚可能 | 1.3.4 表示の向き | AA | コンテンツが縦向き・横向きの両方で閲覧可能か。特定の向きに固定されていないか | 要目視確認 | 未確認 |  |\n| 11 | 知覚可能 | 1.3.5 入力目的の特定 | AA | フォーム要素に適切なautocomplete属性が設定されているか | 自動判定(Claude) | 確認OK | 利用者自身に関する情報を入力する欄がない（サイト内検索のみ）; 証拠: HTML の入力欄は `\u003Cinput type=\"search\" name=\"q\" placeholder=\"例: 会議室\" aria-label=\"サイト内検索\">` の1つだけ |\n| 12 | 知覚可能 | 1.4.1 色の使用 | A | 色だけで情報を伝えていないか。色以外の手がかり（テキスト、アイコン、下線等）があるか | 自動判定(Claude) | 確認OK | 本文リンクは下線で区別されており、色のみで意味を伝えている記述がない; 証拠: style.css `.content a { color: #1d4ed8; text-decoration: underline; }` |\n| 13 | 知覚可能 | 1.4.2 音声の制御 | A | 自動再生される音声が3秒以上の場合、一時停止/停止/音量調整の手段があるか | 自動判定(Visual) | 確認OK | 自動再生する音声がない; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n| 14 | 知覚可能 | 1.4.3 コントラスト（最低限） | AA | テキストと背景のコントラスト比が4.5:1以上（大文字テキストは3:1以上） | 自動判定 | 修正あり | Elements must meet minimum color contrast ratio | 入力エラーが自動検出された場合、エラー箇所と内容がテキストで説明されているか | 自動判定(Claude) | 確認OK | 入力エラーを検出・通知する仕組みがない（サイト内検索のみで必須・書式制約なし）; 証拠: HTML の唯一の入力欄 `\u003Cinput type=\"search\" name=\"q\" … aria-label=\"サイト内検索\">` に `required` / `pattern` がなく、`\u003Cscript>` 要素も存在しない |\n| 49 | 理解可能 | 3.3.2 ラベル又は説明 | A | フォーム要素にラベルまたは入力説明があるか。label要素の紐付けと説明の適切さ | 要目視確認 | 未確認 | axe-core は達成基準の一部のみ検証（form-field-multiple-labels）。この pass だけでは適合と判定していません |\n| 50 | 理解可能 | 3.3.3 エラー修正の提案 | AA | 入力エラーが検出された場合、修正方法の提案が提示されるか | 自動判定(Claude) | 確認OK | 入力エラーを検出する仕組みがないため修正提案の対象がない; 証拠: HTML の唯一の入力欄 `\u003Cinput type=\"search\" name=\"q\" … aria-label=\"サイト内検索\">` に `required` / `pattern` がなく、`\u003Cscript>` 要素も存在しない |\n| 51 | 理解可能 | 3.3.4 エラー回避（法的、金融、データ） | AA | 法的/金融的な取引やデータ送信の前に、確認・修正・取消が可能か | 自動判定(Claude) | 確認OK | 法的行為・金銭取引・利用者制御データの変更を伴う送信がない; 証拠: HTML のフォームは `\u003Cform class=\"search-form\" action=\"#\" method=\"get\">`（サイト内検索）のみ |\n| 52 | 理解可能 | 3.3.7 冗長な入力 | A | 同一プロセス内で以前に入力された情報の再入力を求めないか（自動入力、選択肢からの選択等の手段があるか） | 自動判定(Claude) | 確認OK | 同じ情報を再入力させる工程がない; 証拠: HTML の入力欄は `\u003Cinput type=\"search\" name=\"q\">` の1つのみで多段階工程がない |\n| 53 | 理解可能 | 3.3.8 アクセシブル認証（最小） | AA | 認証プロセスが認知機能テスト（パスワード記憶、パズル解読等）のみに依存していないか | 自動判定(Visual) | 確認OK | 認証を要する機能がない; 証拠: ng/index.html に `\u003Cinput type=\"password\">` 要素・ログインフォームが存在しない; 証拠: パスワード入力なし（該当コンテンツなし） |\n| 54 | 堅牢 | 4.1.2 名前（name）、役割（role）及び値（value） | A | カスタムUIコンポーネントに適切なrole、name、stateがARIAで設定されているか | 自動判定(Claude) | 修正あり | 検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない |\n| 55 | 堅牢 | 4.1.3 ステータスメッセージ | AA | 成功/エラー/進行状況等のステータスメッセージがrole=\"status\"やaria-liveで支援技術に伝わるか | 自動判定(Claude) | 確認OK | 動的に更新されるステータスメッセージがない; 証拠: ng/index.html に `\u003Cscript>` 要素・`aria-live` / `role=\"status\"` / `role=\"alert\"` 属性が存在しない |\n\n---\n\n## 修正が必要な項目の詳細\n\n### No.1 — 1.1.1 非テキストコンテンツ (自動判定(Claude))\n\n主要画像の代替テキストが「画像」で、画像が伝えている内容を説明していない; 証拠: HTML `\u003Cimg src=\"../assets/hero.svg\" alt=\"画像\">`、ツリー `- img \"画像\"`\n\n\n### No.7 — 1.3.1 情報及び関係性 (自動判定(Claude))\n\n見出しレベルが h1 の次に h3 へ飛んでおり、見出しの階層関係がマークアップから正しく伝わらない; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` の次の見出しが `- heading \"お知らせ\" [level=3]`（h2 が存在しない）。HTML も `\u003Ch1>` → `\u003Ch3 class=\"section-title\">お知らせ\u003C/h3>` → `\u003Ch4 class=\"card-title\">`\n\n\n### No.14 — 1.4.3 コントラスト（最低限） (自動判定)\n\nElements must meet minimum color contrast ratio thresholds（3件）\n\n**axe-core: color-contrast**（影響度: serious）\n\n> Elements must meet minimum color contrast ratio thresholds\n\n```html\n\u003Cspan class=\"date\">2026年8月10日\u003C/span>\n```\n\n\n```html\n\u003Cspan class=\"date\">2026年8月1日\u003C/span>\n```\n\n\n```html\n\u003Cspan class=\"date\">2026年7月15日\u003C/span>\n```\n\n\n\n### No.27 — 2.4.1 ブロックスキップ (自動判定(Claude))\n\nランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない\n\n\n### No.30 — 2.4.4 リンクの目的（コンテキスト内） (自動判定(Claude))\n\n「こちら」「詳しくはこちら」「詳細はこちら」など、リンクテキスト単独ではリンク先が判別できないリンクが5件ある; 証拠: ツリー `- link \"詳しくはこちら\"` / `- link \"こちら\"`（お知らせ2件目）/ `- link \"詳細はこちら\"` / カード3件の `- link \"こちら\"`\n\n\n### No.33 — 2.4.7 フォーカスの可視化 (自動判定(Interactive))\n\n10個中0個でのみフォーカスが視認可能。多くの要素でフォーカスインジケータが不足しています。\n\n\n### No.41 — 3.1.1 ページの言語 (自動判定(Claude))\n\nhtml 要素に lang 属性がなく、ページの言語が判定できない; 証拠: HTML 2行目が `\u003Chtml>`（lang 属性なし）\n\n**axe-core: html-has-lang**（影響度: serious）\n\n> \u003Chtml> element must have a lang attribute\n\n```html\n\u003Chtml>\n```\n\n\n\n### No.42 — 3.1.2 一部分の言語 (自動判定(Claude))\n\n日本語ページ中の英文に lang 属性が指定されていない; 証拠: HTML `\u003Cspan class=\"en\">A place for everyone in Tsubamedai.\u003C/span>`（`lang=\"en\"` なし）\n\n\n### No.54 — 4.1.2 名前（name）、役割（role）及び値（value） (自動判定(Claude))\n\n検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない\n\n**axe-core: button-name**（影響度: critical）\n\n> Buttons must have discernible text\n\n```html\n\u003Cbutton type=\"submit\">\n```\n\n\n\n---\n\n## 対応優先度まとめ\n\n| 優先度 | No. | 項目 | 影響度 | 推奨対応 |\n|--------|-----|------|--------|---------|\n| 🔴 高 | 54 | 4.1.2 名前（name）、役割（role）及び値（value） | critical | 検索ボタンに可視テキスト「検索」を戻すか、`aria-label` でアクセシブル名を与える。 |\n| 🔴 高 | 1 | 1.1.1 非テキストコンテンツ | — | hero 画像の alt を「つばめ台コミュニティセンターの外観。本館と別館の2棟…」のように、画像が伝えている内容の説明に書き換える。 |\n| 🔴 高 | 7 | 1.3.1 情報及び関係性 | — | セクション見出しを h2、カード見出しを h3 にして、h1 からレベルを飛ばさない階層にする。 |\n| 🔴 高 | 14 | 1.4.3 コントラスト（最低限） | serious | お知らせの日付（#aaaaaa）を背景 #f5f7fa に対して 4.5:1 以上になる色（例: #595959）に変更する。 |\n| 🔴 高 | 27 | 2.4.1 ブロックスキップ | — | ヘッダー・ナビ・本文・フッターを header / nav / main / footer 要素に置き換え、本文へのスキップリンクを追加する。 |\n| 🔴 高 | 30 | 2.4.4 リンクの目的（コンテキスト内） | — | 「こちら」「詳しくはこちら」をやめ、リンクテキスト自体にリンク先の内容（例:「貸室の一覧と利用料金を見る」）を書く。 |\n| 🔴 高 | 41 | 3.1.1 ページの言語 | serious | html 要素に `lang=\"ja\"` を指定する。 |\n| 🟡 中 | 33 | 2.4.7 フォーカスの可視化 | — | `:focus { outline: none; }` を削除し、フォーカス時に視認できるアウトライン（例: 3px solid + offset）を指定する。 |\n| 🟡 中 | 42 | 3.1.2 一部分の言語 | — | 英文を囲む span に `lang=\"en\"` を指定する。 |\n","./markdown/ng-TOP-baseline-17.md":"# 基本17項目チェック（デジタル庁ガイドブック）\n\n対象: http://127.0.0.1:8765/ng/index.html\n実行日時: 2026-08-21 02:09\n\n> WCAG 2.2 Level A+AA の55項目の判定結果を、デジタル庁『ウェブアクセシビリティ導入ガイドブック』の\n> **基本17項目（重大4＋必須13）** に集約したものです。\n> **⚠️ この結果は正式なアクセシビリティ試験（JIS X 8341-3:2016）の代替にはなりません。**\n\n## サマリー\n\n| | 件数 |\n|---|---|\n| ❌ 要修正 | 8 |\n| ⚠️ 一部未確認（目視が必要な基準が残っている） | 3 |\n| ✅ 確認OK | 6 |\n| — 判定対象外 | 0 |\n\n## 重大（4項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 1 | 自動再生はさせない | ✅ 確認OK | 1基準中 確認 1 |\n| 2 | 袋小路に陥らせない（キーボードトラップ） | ✅ 確認OK | 1基準中 確認 1 |\n| 3 | 光の点滅は危険 | ✅ 確認OK | 1基準中 確認 1 |\n| 4 | 自動でコンテンツを切り替えない | ✅ 確認OK | 1基準中 確認 1 |\n\n## 必須（13項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 5 | 画像に代替テキストを付与する | ❌ 要修正 | 1基準中 **不適合 1** |\n| 6 | キーボードだけで全機能にアクセスできる | ❌ 要修正 | 5基準中 確認 3 / **不適合 1** / 未確認 1 |\n| 7 | 操作に制限時間を設けない | ✅ 確認OK | 2基準中 確認 2 |\n| 8 | 単一の表現だけで情報を伝えない | ❌ 要修正 | 3基準中 確認 2 / **不適合 1** |\n| 9 | 読み上げ順序が意味の通る順になっている | ❌ 要修正 | 3基準中 確認 1 / **不適合 1** / 未確認 1 |\n| 10 | 見出し要素でセクションを表現する | ❌ 要修正 | 4基準中 **不適合 2** / 未確認 1 / 対象外 1 |\n| 11 | 文字と背景に十分なコントラスト比 | ❌ 要修正 | 1基準中 **不適合 1** |\n| 12 | 拡大縮小しても情報が読み取れる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 13 | 文字・文字コード・フォントの注意 | ❌ 要修正 | 3基準中 **不適合 1** / 未確認 1 / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 15 | リンクを適切に表現する | ❌ 要修正 | 1基準中 **不適合 1** |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ng/index.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 13 個のうち 14 個（108%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ng/index.html に `\u003Cvideo>` 要素がなく、ng/style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: ng/style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 不適合 | 自動判定(Claude) | 主要画像の代替テキストが「画像」で、画像が伝えている内容を説明していない; 証拠: HTML `\u003Cimg src=\"../assets/hero.svg\" alt=\"画像\">`、ツリー `- img \"画像\"` |\n\n### 6. キーボードだけで全機能にアクセスできる — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 適合 | 自動判定(Claude) | 操作要素はネイティブの a / butt  意味のある順序 | 適合 | 自動判定(Claude) | DOM順（ヘッダー→ナビ→本文→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- paragraph: - link \"つばめ台コミュニティセンター\"` → `- searchbox \"サイト内検索\"` → ナビの `- list:` → `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` → フッターの `- paragraph: \"つばめ台コミュニティセンター 〒000-0000 …\"` の順に並ぶ |\n| 2.4.3 フォーカス順序 | 目視確認 | 要目視確認 |  |\n\n### 10. 見出し要素でセクションを表現する — ❌ 要修正\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 見出しレベルが h1 の次に h3 へ飛んでおり、見出しの階層関係がマークアップから正しく伝わらない; 証拠: ツリー `- heading \"つばめ台コミュニティセンターへようこそ\" [level=1]` の次の見出しが `- heading \"お知らせ\" [level=3]`（h2 が存在しない）。HTML も `\u003Ch1>` → `\u003Ch3 class=\"section-title\">お知らせ\u003C/h3>` → `\u003Ch4 class=\"card-title\">` |\n| 2.4.6 見出し及びラベル | 目視確認 | 要目視確認 |  |\n| 2.4.1 ブロックスキップ | 不適合 | 自動判定(Claude) | ランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない |\n| 2.4.10 | — | 判定対象外 | Level AAA のため A+AA の判定対象外 |\n\n### 11. 文字と背景に十分なコントラスト比 — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.3 コントラスト（最低限） | 不適合 | 自動判定 | Elements must meet minimum color contrast ratio thresholds（3件） |\n\n### 12. 拡大縮小しても情報が読み取れる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.4 テキストのサイズ変更 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（meta-viewport）。この pass だけでは適合と判定していません |\n\n### 13. 文字・文字コード・フォントの注意 — ❌ 要修正\n\n> 4.1.1（構文解析）は WCAG 2.2 で廃止されたため判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.3.2 ラベル又は説明 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（form-field-multiple-labels）。この pass だけでは適合と判定していません |\n| 4.1.1 | — | 判定対象外 | WCAG 2.2 で廃止 |\n| 4.1.2 名前（name）、役割（role）及び値（value） | 不適合 | 自動判定(Claude) | 検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない |\n\n### 14. ページタイトルを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.2 ページタイトル | 適合 | 自動判定(Claude) | ページの内容を説明するタイトルが設定されている; 証拠: HTML `\u003Ctitle>トップページ \\| つばめ台コミュニティセンター\u003C/title>` |\n\n### 15. リンクを適切に表現する — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.4 リンクの目的（コンテキスト内） | 不適合 | 自動判定(Claude) | 「こちら」「詳しくはこちら」「詳細はこちら」など、リンクテキスト単独ではリンク先が判別できないリンクが5件ある; 証拠: ツリー `- link \"詳しくはこちら\"` / `- link \"こちら\"`（お知らせ2件目）/ `- link \"詳細はこちら\"` / カード3件の `- link \"こちら\"` |\n\n### 16. ナビゲーションに一貫性をもたせる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.3 一貫したナビゲーション | 目視確認 | 要目視確認 |  |\n\n### 17. 同じ機能には同じラベルをつける — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.4 一貫した識別性 | 目視確認 | 要目視確認 |  |\n\n---\n\n出典: デジタル庁『ウェブアクセシビリティ導入ガイドブック』2024-03-29版 §3.1・§3.2\nhttps://www.digital.go.jp/resources/introduction-to-web-accessibility-guidebook\n\n本ツールはデジタル庁・WAIC・W3C・JISC の認証や推奨を受けたものではありません。","./markdown/ng-施設案内.md":"# ページ: ng-施設案内\n\n| 項目 | 値 |\n|------|-----|\n| 対象URL | http://127.0.0.1:8765/ng/facility.html |\n| テスト日時 | 2026-08-21 02:09 |\n| 対象基準 | WCAG 2.2 Level AA |\n| テストツール | axe-core + Playwright（自動判定）、Claude 分析（自動判定(Claude)） |\n\n> **凡例**\n> - **自動判定**: axe-core による自動テスト結果\n> - **自動判定(Visual)**: Playwright Visual テスト結果\n> - **自動判定(Interactive)**: Playwright Interactive テスト結果\n> - **自動判定(Claude)**: アクセシビリティツリー（またはHTML）を分析して判定した結果\n> - **要目視確認**: ブラウザ操作が必要なため、人による目視確認が必要\n\n## サマリー\n\n| カテゴリ | 件数 |\n|---------|------|\n| 🔴 修正あり | 7件 |\n| ✅ 確認OK | 39件 |\n| ⚠️ 未確認 | 9件 |\n\n---\n\n## チェック項目\n\n| No. | カテゴリ | チェック項目 | レベル | 確認内容 | 担当 | 結果 | 備考 |\n|-----|---------|------------|--------|---------|------|------|------|\n| 1 | 知覚可能 | 1.1.1 非テキストコンテンツ | A | img要素のalt属性の有無、alt値が適切か、装飾画像にalt=\"\"が設定されているか | 自動判定(Claude) | 修正あり | ギャラリーの画像3枚に alt 属性がなく、支援技術に内容が伝わらない; 証拠: HTML `\u003Cimg src=\"../assets/room-hall.svg\">` / `\u003Cimg src=\"../assets/room-music.svg\">` / `\u003Cimg src=\"../ （自動入力、選択肢からの選択等の手段があるか） | 自動判定(Claude) | 確認OK | 同じ情報を再入力させる工程がない; 証拠: HTML の入力欄は `\u003Cinput type=\"search\" name=\"q\">` の1つのみで多段階工程がない |\n| 53 | 理解可能 | 3.3.8 アクセシブル認証（最小） | AA | 認証プロセスが認知機能テスト（パスワード記憶、パズル解読等）のみに依存していないか | 自動判定(Visual) | 確認OK | 認証を要する機能がない; 証拠: ng/facility.html に `\u003Cinput type=\"password\">` 要素・ログインフォームが存在しない; 証拠: パスワード入力なし（該当コンテンツなし） |\n| 54 | 堅牢 | 4.1.2 名前（name）、役割（role）及び値（value） | A | カスタムUIコンポーネントに適切なrole、name、stateがARIAで設定されているか | 自動判定(Claude) | 修正あり | 検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない |\n| 55 | 堅牢 | 4.1.3 ステータスメッセージ | AA | 成功/エラー/進行状況等のステータスメッセージがrole=\"status\"やaria-liveで支援技術に伝わるか | 自動判定(Claude) | 確認OK | 動的に更新されるステータスメッセージがない; 証拠: ng/facility.html に `\u003Cscript>` 要素・`aria-live` / `role=\"status\"` / `role=\"alert\"` 属性が存在しない |\n\n---\n\n## 修正が必要な項目の詳細\n\n### No.1 — 1.1.1 非テキストコンテンツ (自動判定(Claude))\n\nギャラリーの画像3枚に alt 属性がなく、支援技術に内容が伝わらない; 証拠: HTML `\u003Cimg src=\"../assets/room-hall.svg\">` / `\u003Cimg src=\"../assets/room-music.svg\">` / `\u003Cimg src=\"../assets/room-kitchen.svg\">`（alt 属性なし）、ツリー `- img`（名前なし）が3件\n\n**axe-core: image-alt**（影響度: critical）\n\n> Images must have alternative text\n\n```html\n\u003Cimg src=\"../assets/room-hall.svg\">\n```\n\n\n```html\n\u003Cimg src=\"../assets/room-music.svg\">\n```\n\n\n```html\n\u003Cimg src=\"../assets/room-kitchen.svg\">\n```\n\n\n\n### No.7 — 1.3.1 情報及び関係性 (自動判定(Claude))\n\n貸室一覧の表が見出しセル（th）も caption も持たず、行・列の対応関係が支援技術に伝わらない。表題は表外の p 要素で示されている; 証拠: HTML `\u003Ctd class=\"th-like\">部屋名\u003C/td>` と `\u003Cp class=\"table-title\">貸室一覧（定員・利用料金・主な設備）\u003C/p>`、ツリー `- table:` 配下が `- cell \"部屋名\"` のみで `- columnheader` / `- caption` が存在しない（同ページの開館時間表は `- rowheader \"平日\"` を持つ）\n\n\n### No.27 — 2.4.1 ブロックスキップ (自動判定(Claude))\n\nランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない\n\n\n### No.28 — 2.4.2 ページタイトル (自動判定(Claude))\n\ntitle 要素が無く、ページを識別できるタイトルが存在しない; 証拠: ng/facility.html の `\u003Chead>` は `\u003Cmeta charset>` / `\u003Cmeta name=\"viewport\">` / `\u003Clink rel=\"stylesheet\">` のみで `\u003Ctitle>` 要素がない\n\n**axe-core: document-title**（影響度: serious）\n\n> Documents must have \u003Ctitle> element to aid in navigation\n\n```html\n\u003Chtml lang=\"ja\">\n```\n\n\n\n### No.32 — 2.4.6 見出し及びラベル (自動判定(Claude))\n\n減免制度を説明するセクションの見出しが「その他のご案内」で、直下の内容（利用料金の減免）を説明していない; 証拠: ツリー `- heading \"その他のご案内\" [level=2]` の直後が `- paragraph: 次のいずれかに当てはまる団体は、利用料金が半額になります。窓口で減免申請書をご提出ください。`\n\n\n### No.33 — 2.4.7 フォーカスの可視化 (自動判定(Interactive))\n\n7個中0個でのみフォーカスが視認可能。多くの要素でフォーカスインジケータが不足しています。\n\n\n### No.54 — 4.1.2 名前（name）、役割（role）及び値（value） (自動判定(Claude))\n\n検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない\n\n**axe-core: button-name**（影響度: critical）\n\n> Buttons must have discernible text\n\n```html\n\u003Cbutton type=\"submit\">\n```\n\n\n\n---\n\n## 対応優先度まとめ\n\n| 優先度 | No. | 項目 | 影響度 | 推奨対応 |\n|--------|-----|------|--------|---------|\n| 🔴 高 | 1 | 1.1.1 非テキストコンテンツ | critical | ギャラリーの各 img に、部屋の様子を説明する alt を付ける。 |\n| 🔴 高 | 54 | 4.1.2 名前（name）、役割（role）及び値（value） | critical | 検索ボタンに可視テキスト「検索」を戻すか、`aria-label` でアクセシブル名を与える。 |\n| 🔴 高 | 7 | 1.3.1 情報及び関係性 | — | 貸室一覧の見出し行を `\u003Cth scope=\"col\">`、部屋名の列を `\u003Cth scope=\"row\">` に変え、表題を `\u003Ccaption>` に移す。 |\n| 🔴 高 | 27 | 2.4.1 ブロックスキップ | — | ヘッダー・ナビ・本文・フッターを header / nav / main / footer 要素に置き換え、本文へのスキップリンクを追加する。 |\n| 🔴 高 | 28 | 2.4.2 ページタイトル | serious | head に「施設案内 \\| つばめ台コミュニティセンター」のような title 要素を追加する。 |\n| 🟡 中 | 32 | 2.4.6 見出し及びラベル | — | 見出しを「利用料金の減免について」など、直下の内容を説明する文言に戻す。 |\n| 🟡 中 | 33 | 2.4.7 フォーカスの可視化 | — | `:focus { outline: none; }` を削除し、フォーカス時に視認できるアウトライン（例: 3px solid + offset）を指定する。 |\n","./markdown/ng-施設案内-baseline-17.md":"# 基本17項目チェック（デジタル庁ガイドブック）\n\n対象: http://127.0.0.1:8765/ng/facility.html\n実行日時: 2026-08-21 02:09\n\n> WCAG 2.2 Level A+AA の55項目の判定結果を、デジタル庁『ウェブアクセシビリティ導入ガイドブック』の\n> **基本17項目（重大4＋必須13）** に集約したものです。\n> **⚠️ この結果は正式なアクセシビリティ試験（JIS X 8341-3:2016）の代替にはなりません。**\n\n## サマリー\n\n| | 件数 |\n|---|---|\n| ❌ 要修正 | 7 |\n| ⚠️ 一部未確認（目視が必要な基準が残っている） | 4 |\n| ✅ 確認OK | 6 |\n| — 判定対象外 | 0 |\n\n## 重大（4項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 1 | 自動再生はさせない | ✅ 確認OK | 1基準中 確認 1 |\n| 2 | 袋小路に陥らせない（キーボードトラップ） | ✅ 確認OK | 1基準中 確認 1 |\n| 3 | 光の点滅は危険 | ✅ 確認OK | 1基準中 確認 1 |\n| 4 | 自動でコンテンツを切り替えない | ✅ 確認OK | 1基準中 確認 1 |\n\n## 必須（13項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 5 | 画像に代替テキストを付与する | ❌ 要修正 | 1基準中 **不適合 1** |\n| 6 | キーボードだけで全機能にアクセスできる | ❌ 要修正 | 5基準中 確認 4 / **不適合 1** |\n| 7 | 操作に制限時間を設けない | ✅ 確認OK | 2基準中 確認 2 |\n| 8 | 単一の表現だけで情報を伝えない | ❌ 要修正 | 3基準中 確認 2 / **不適合 1** |\n| 9 | 読み上げ順序が意味の通る順になっている | ❌ 要修正 | 3基準中 確認 2 / **不適合 1** |\n| 10 | 見出し要素でセクションを表現する | ❌ 要修正 | 4基準中 **不適合 3** / 対象外 1 |\n| 11 | 文字と背景に十分なコントラスト比 | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 12 | 拡大縮小しても情報が読み取れる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 13 | 文字・文字コード・フォントの注意 | ❌ 要修正 | 3基準中 **不適合 1** / 未確認 1 / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ❌ 要修正 | 1基準中 **不適合 1** |\n| 15 | リンクを適切に表現する | ✅ 確認OK | 1基準中 確認 1 |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ng/facility.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 7 個のうち 8 個（114%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ng/facility.html に `\u003Cvideo>` 要素がなく、ng/style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: ng/style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 不適合 | 自動判定(Claude) | ギャラリーの画像3枚に alt 属性がなく、支援技術に内容が伝わらない; 証拠: HTML `\u003Cimg src=\"../assets/room-hall.svg\">` / `\u003Cimg src=\"../assets/room-music.svg\">` / `\u003Cimg src=\"../assets/room-kitchen.svg\">`（alt 属性なし）、ツリー `- img`（名前なし）が3件 |\n\n### 6. キーボードだけで全機能にアクセスできる — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 適合 | 自動判定(Claude) | 操作要素はネイティブの a / button / input のみで、独自のクリックハンドラを持つ要素がない; 証拠: ng/facility.html に `\u003Cscript>` 要素・`onclick` 属性が存在せず、ツリーの操作要素は `- link` / `- button` / `- searchbox \"サイト内検索\"` のみ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 7個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n| 2.4.7 フォーカスの可視化 | 不適合 | 自動判定(Interactive) | 7個中0個でのみフォーカスが視認可能。多くの要素でフォーカスインジケータが不足しています。 |\n| 3.2.1 フォーカス時 | 適合 | 自動判定(Interactive) | 証拠: 7個の要素でフォーカス前後の URL・DOM に変化がないことを確認しました。 |\n| 3.2.2 入力時 | 適合 | 自動判定(Interactive) | 証拠: 1個のフォームフィールド（テキスト入力・select・checkbox / radio）で値の入力・変更前後の URL・DOM に変化がないことを確認しました。 |\n\n### 7. 操作に制限時間を設けない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.1 タイミング調整可能 | 適合 | 自動判定(Claude) | 制限時間のあるコンテンツがない; 証拠: ng/facility.html に `\u003Cmeta http-equiv=\"refresh\">` も `\u003Cscript>` も存在しない |\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: ng/style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 8. 単一の表現だけで情報を伝えない — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 貸室一覧の表が見出しセル（th）も caption も持たず、行・列の対応関係が支援技術に伝わらない。表題は表外の p 要素で示されている; 証拠: HTML `\u003Ctd class=\"th-like\">部屋名\u003C/td>` と `\u003Cp class=\"table-title\">貸室一覧（定員・利用料金・主な設備）\u003C/p>`、ツリー `- table:` 配下が `- cell \"部屋名\"` のみで `- columnheader` / `- caption` が存在しない（同ページの開館時間表は `- rowheader \"平日\"` を持つ） |\n| 1.3.3 感覚的な特徴 | 適合 | 自動判定(Claude) | 形状・位置・音などの感覚的特徴のみに依存した説明文がない; 証拠: 本文テキスト（`- paragraph: 予約は利用日の3か月前から、窓口または電話で受け付けています。` 等）に「右の表」「丸いアイコン」等の感覚依存の指示が含まれない |\n| 1.4.1 色の使用 | 適合 | 自動判定(Claude) | 本文リンクは下線で区別されており、色のみで意味を伝えている記述がない; 証拠: ng/style.css `.content a { color: #1d4ed8; text-decoration: underline; }` |\n\n### 9. 読み上げ順序が意味の通る順になっている — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 貸室一覧の表が見出しセル（th）も caption も持たず、行・列の対応関係が支援技術に伝わらない。表題は表外の p 要素で示されている; 証拠: HTML `\u003Ctd class=\"th-like\">部屋名\u003C/td>` と `\u003Cp class=\"table-title\">貸室一覧（定員・利用料金・主な設備）\u003C/p>`、ツリー `- table:` 配下が `- cell \"部屋名\"` のみで `- columnheader` / `- caption` が存在しない（同ページの開館時間表は `- rowheader \"平日\"` を持つ） |\n| 1.3.2 意味のある順序 | 適合 | 自動判定(Claude) | DOM順（ヘッダー→ナビ→本文→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- paragraph: - link \"つばめ台コミュニティセンター\"` → ナビの `- list:` → `- heading \"施設案内\" [level=1]` → フッターの `- paragraph: \"つばめ台コミュニティセンター 〒000-0000 …\"` の順に並ぶ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 7個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n\n### 10. 見出し要素でセクションを表現する — ❌ 要修正\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 貸室一覧の表が見出しセル（th）も caption も持たず、行・列の対応関係が支援技術に伝わらない。表題は表外の p 要素で示されている; 証拠: HTML `\u003Ctd class=\"th-like\">部屋名\u003C/td>` と `\u003Cp class=\"table-title\">貸室一覧（定員・利用料金・主な設備）\u003C/p>`、ツリー `- table:` 配下が `- cell \"部屋名\"` のみで `- columnheader` / `- caption` が存在しない（同ページの開館時間表は `- rowheader \"平日\"` を持つ） |\n| 2.4.6 見出し及びラベル | 不適合 | 自動判定(Claude) | 減免制度を説明するセクションの見出しが「その他のご案内」で、直下の内容（利用料金の減免）を説明していない; 証拠: ツリー `- heading \"その他のご案内\" [level=2]` の直後が `- paragraph: 次のいずれかに当てはまる団体は、利用料金が半額になります。窓口で減免申請書をご提出ください。` |\n| 2.4.1 ブロックスキップ | 不適合 | 自動判定(Claude) | ランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない |\n| 2.4.10 | — | 判定対象外 | Level AAA のため A+AA の判定対象外 |\n\n### 11. 文字と背景に十分なコントラスト比 — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.3 コントラスト（最低限） | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（color-contrast）。この pass だけでは適合と判定していません |\n\n### 12. 拡大縮小しても情報が読み取れる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.4 テキストのサイズ変更 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（meta-viewport）。この pass だけでは適合と判定していません |\n\n### 13. 文字・文字コード・フォントの注意 — ❌ 要修正\n\n> 4.1.1（構文解析）は WCAG 2.2 で廃止されたため判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.3.2 ラベル又は説明 | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（form-field-multiple-labels）。この pass だけでは適合と判定していません |\n| 4.1.1 | — | 判定対象外 | WCAG 2.2 で廃止 |\n| 4.1.2 名前（name）、役割（role）及び値（value） | 不適合 | 自動判定(Claude) | 検索の送信ボタンにアクセシブル名がなく、支援技術に用途が伝わらない; 証拠: ツリー `- button`（引用符内の名前なし）。HTML `\u003Cbutton type=\"submit\">` の中身は `aria-hidden=\"true\"` の SVG のみでテキストがない |\n\n### 14. ページタイトルを適切に表現する — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.2 ページタイトル | 不適合 | 自動判定(Claude) | title 要素が無く、ページを識別できるタイトルが存在しない; 証拠: ng/facility.html の `\u003Chead>` は `\u003Cmeta charset>` / `\u003Cmeta name=\"viewport\">` / `\u003Clink rel=\"stylesheet\">` のみで `\u003Ctitle>` 要素がない |\n\n### 15. リンクを適切に表現する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.4 リンクの目的（コンテキスト内） | 適合 | 自動判定(Claude) | リンクテキスト単独で目的を判別できる; 証拠: ツリー `- link \"お問い合わせフォーム\"` / `- link \"トップ\"` / `- link \"施設案内\"`（「こちら」等の曖昧なリンクテキストなし） |\n\n### 16. ナビゲーションに一貫性をもたせる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.3 一貫したナビゲーション | 目視確認 | 要目視確認 |  |  1.3.1 情報及び関係性 (自動判定(Claude))\n\n電話番号欄がラベルと関連付けられておらず、同意チェックボックスが div のためツリーに現れない; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label なし）→ ツリー `- textbox`（名前なし）。同意欄は `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>` で、ツリーには `- text: 個人情報の取り扱いに同意する` しか現れずチェックボックスが存在しない\n\n\n### No.9 — 1.3.3 感覚的な特徴 (自動判定(Claude))\n\n必須項目の指示が「赤字」という色（視覚的特徴）のみに依存している; 証拠: ツリー `- paragraph: 赤字の項目は必須です。` と ng/style.css `.field label.required { color: #b30000; }`（ラベル文字列自体には必須の表記がなく `- textbox \"お名前\"`）\n\n\n### No.11 — 1.3.5 入力目的の特定 (自動判定(Claude))\n\n氏名・メールアドレスの入力欄に autocomplete 属性がなく、入力目的がプログラムから判別できない; 証拠: HTML `\u003Cinput type=\"text\" id=\"name\" name=\"name\">` / `\u003Cinput type=\"email\" id=\"email\" name=\"email\">`（autocomplete なし。電話番号欄のみ `autocomplete=\"tel\"`）\n\n\n### No.12 — 1.4.1 色の使用 (自動判定(Claude))\n\n必須項目を赤い文字色だけで示しており、色を知覚できない利用者に必須かどうかが伝わらない; 証拠: ng/style.css `.field label.required { color: #b30000; }` と HTML `\u003Cp>赤字の項目は必須です。\u003C/p>`、`\u003Clabel for=\"name\" class=\"required\">お名前\u003C/label>`（テキストに「必須」の表記なし）\n\n\n### No.15 — 1.4.4 テキストのサイズ変更 (自動判定)\n\nZooming and scaling must not be disabled（1件）\n\n**axe-core: meta-viewport**（影響度: moderate）\n\n> Zooming and scaling must not be disabled\n\n```html\n\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">\n```\n\n\n\n### No.18 — 1.4.11 非テキストのコントラスト (自動判定(Visual))\n\n5個の UI コンポーネントでコントラスト比が 3:1 未満\n\n\n### No.21 — 2.1.1 キーボード (自動判定(Claude))\n\n同意チェックボックスが div で実装されており、キーボードでフォーカス・操作できない; 証拠: HTML `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>`（`tabindex` / `role` / キーイベントなし、`\u003Cscript>` 要素も存在しない）\n\n\n### No.27 — 2.4.1 ブロックスキップ (自動判定(Claude))\n\nランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない\n\n\n### No.28 — 2.4.2 ページタイトル (自動判定(Claude))\n\nタイトルが「ページ」で、ページの主題も所属サイトも示していない; 証拠: HTML `\u003Ctitle>ページ\u003C/title>`（同サイトの他ページは「トップページ | つばめ台コミュニティセンター」形式）\n\n\n### No.33 — 2.4.7 フォーカスの可視化 (自動判定(Interactive))\n\n10個中0個でのみフォーカスが視認可能。多くの要素でフォーカスインジケータが不足しています。\n\n\n### No.37 — 2.5.3 名前（name）のラベル (自動判定(Visual))\n\n1個の要素で visible text と accessible name が不一致\n\n\n### No.49 — 3.3.2 ラベル又は説明 (自動判定(Claude))\n\n電話番号欄にラベルが関連付けられておらず、必須項目の指示も色のみで示されている; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label 要素なし）→ ツリー `- textbox`（名前なし）。必須の説明は `\u003Cp>赤字の項目は必須です。\u003C/p>` のみ\n\n\n### No.54 — 4.1.2 名前（name）、役割（role）及び値（value） (自動判定(Claude))\n\n名前のない入力欄・ボタンと、役割を持たない擬似チェックボックスがある; 証拠: ツリー `- textbox`（電話番号欄、名前なし）/ `- button`（検索ボタン、名前なし）、HTML `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>`（role / 状態を持たずツリーに現れない）\n\n**axe-core: button-name**（影響度: critical）\n\n> Buttons must have discernible text\n\n```html\n\u003Cbutton type=\"submit\">\n```\n\n\n**axe-core: label**（影響度: critical）\n\n> Form elements must have labels\n\n```html\n\u003Cinput type=\"tel\" id=\"tel\" name=\"tel\" autocomplete=\"tel\">\n```\n\n\n\n---\n\n## 対応優先度まとめ\n\n| 優先度 | No. | 項目 | 影響度 | 推奨対応 |\n|--------|-----|------|--------|---------|\n| 🔴 高 | 54 | 4.1.2 名前（name）、役割（role）及び値（value） | critical | 名前のない入力欄・ボタンにラベルを与え、擬似チェックボックスをネイティブ要素に置き換える。 |\n| 🔴 高 | 7 | 1.3.1 情報及び関係性 | — | 電話番号欄を `\u003Clabel for=\"tel\">` で関連付け、擬似チェックボックスを `\u003Cinput type=\"checkbox\">` + label に置き換える。 |\n| 🔴 高 | 9 | 1.3.3 感覚的な特徴 | — | 「赤字の項目は必須です」をやめ、各ラベルに「（必須）」の文字を入れる。 |\n| 🔴 高 | 12 | 1.4.1 色の使用 | — | 必須の表示を色だけに頼らず、ラベルのテキスト（「（必須）」）でも示す。 |\n| 🔴 高 | 21 | 2.1.1 キーボード | — | 擬似チェックボックスの div を `\u003Cinput type=\"checkbox\">` に置き換え、キーボードで操作できるようにする。 |\n| 🔴 高 | 27 | 2.4.1 ブロックスキップ | — | ヘッダー・ナビ・本文・フッターを header / nav / main / footer 要素に置き換え、本文へのスキップリンクを追加する。 |\n| 🔴 高 | 28 | 2.4.2 ページタイトル | — | title を「お問い合わせ \\| つばめ台コミュニティセンター」のようにページの主題が分かる文言にする。 |\n| 🔴 高 | 37 | 2.5.3 名前（name）のラベル | — | 送信ボタンの `aria-label=\"フォーム\"` を削除し、可視テキスト「送信する」をアクセシブル名にする。 |\n| 🔴 高 | 49 | 3.3.2 ラベル又は説明 | — | 電話番号欄に label を付け、必須項目の指示を色以外の手段でも示す。 |\n| 🟡 中 | 11 | 1.3.5 入力目的の特定 | — | 氏名欄に `autocomplete=\"name\"`、メール欄に `autocomplete=\"email\"` を指定する。 |\n| 🟡 中 | 15 | 1.4.4 テキストのサイズ変更 | moderate | viewport の `maximum-scale=1, user-scalable=no` を削除し、拡大を禁止しない。 |\n| 🟡 中 | 18 | 1.4.11 非テキストのコントラスト | — | 入力欄・チェックボックスの境界線を、背景に対して 3:1 以上のコントラストになる色（例: #767676）にする。 |\n| 🟡 中 | 33 | 2.4.7 フォーカスの可視化 | — | `:focus { outline: none; }` を削除し、フォーカス時に視認できるアウトライン（例: 3px solid + offset）を指定する。 |\n","./markdown/ng-お問い合わせ-baseline-17.md":"# 基本17項目チェック（デジタル庁ガイドブック）\n\n対象: http://127.0.0.1:8765/ng/contact.html\n実行日時: 2026-08-21 02:09\n\n> WCAG 2.2 Level A+AA の55項目の判定結果を、デジタル庁『ウェブアクセシビリティ導入ガイドブック』の\n> **基本17項目（重大4＋必須13）** に集約したものです。\n> **⚠️ この結果は正式なアクセシビリティ試験（JIS X 8341-3:2016）の代替にはなりません。**\n\n## サマリー\n\n| | 件数 |\n|---|---|\n| ❌ 要修正 | 7 |\n| ⚠️ 一部未確認（目視が必要な基準が残っている） | 4 |\n| ✅ 確認OK | 6 |\n| — 判定対象外 | 0 |\n\n## 重大（4項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 1 | 自動再生はさせない | ✅ 確認OK | 1基準中 確認 1 |\n| 2 | 袋小路に陥らせない（キーボードトラップ） | ✅ 確認OK | 1基準中 確認 1 |\n| 3 | 光の点滅は危険 | ✅ 確認OK | 1基準中 確認 1 |\n| 4 | 自動でコンテンツを切り替えない | ✅ 確認OK | 1基準中 確認 1 |\n\n## 必須（13項目）\n\n| | 項目 | 状態 | 内訳 |\n|---|---|---|---|\n| 5 | 画像に代替テキストを付与する | ✅ 確認OK | 1基準中 確認 1 |\n| 6 | キーボードだけで全機能にアクセスできる | ❌ 要修正 | 5基準中 確認 3 / **不適合 2** |\n| 7 | 操作に制限時間を設けない | ✅ 確認OK | 2基準中 確認 2 |\n| 8 | 単一の表現だけで情報を伝えない | ❌ 要修正 | 3基準中 **不適合 3** |\n| 9 | 読み上げ順序が意味の通る順になっている | ❌ 要修正 | 3基準中 確認 2 / **不適合 1** |\n| 10 | 見出し要素でセクションを表現する | ❌ 要修正 | 4基準中 **不適合 2** / 未確認 1 / 対象外 1 |\n| 11 | 文字と背景に十分なコントラスト比 | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 12 | 拡大縮小しても情報が読み取れる | ❌ 要修正 | 1基準中 **不適合 1** |\n| 13 | 文字・文字コード・フォントの注意 | ❌ 要修正 | 3基準中 **不適合 2** / 対象外 1 |\n| 14 | ページタイトルを適切に表現する | ❌ 要修正 | 1基準中 **不適合 1** |\n| 15 | リンクを適切に表現する | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 16 | ナビゲーションに一貫性をもたせる | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n| 17 | 同じ機能には同じラベルをつける | ⚠️ 一部未確認 | 1基準中 未確認 1 |\n\n## 内訳\n\n### 1. 自動再生はさせない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.2 音声の制御 | 適合 | 自動判定(Visual) | 自動再生する音声がない; 証拠: ng/contact.html に `\u003Caudio>` / `\u003Cvideo>` 要素が存在しない; 証拠: 自動再生メディア要素なし |\n\n### 2. 袋小路に陥らせない（キーボードトラップ） — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.2 キーボードトラップなし | 適合 | 自動判定(Interactive) | 証拠: キーボードトラップは検出されませんでした。操作可能な要素 12 個のうち 13 個（108%）を巡回しました。 |\n\n### 3. 光の点滅は危険 — ✅ 確認OK\n\n> ガイドブックは適合判断の難しさから 2.3.2（AAA）への適合を推奨しているが、本ツールの対象は A+AA のため 2.3.1 で判定する\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.3.1 3回の閃光、又は閾値以下 | 適合 | 自動判定(Claude) | 閃光を伴うコンテンツがない; 証拠: ng/contact.html に `\u003Cvideo>` 要素がなく、ng/style.css に `animation` / `@keyframes` の宣言も存在しない |\n\n### 4. 自動でコンテンツを切り替えない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: ng/style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 5. 画像に代替テキストを付与する — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.1.1 非テキストコンテンツ | 適合 | 自動判定(Claude) | 意味を持つ画像がなく、装飾SVGは支援技術から隠されている; 証拠: ng/contact.html の画像は検索ボタン内の `\u003Csvg aria-hidden=\"true\" focusable=\"false\">` のみで、`\u003Cimg>` 要素は存在しない |\n\n### 6. キーボードだけで全機能にアクセスできる — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.1.1 キーボード | 不適合 | 自動判定(Claude) | 同意チェックボックスが div で実装されており、キーボードでフォーカス・操作できない; 証拠: HTML `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>`（`tabindex` / `role` / キーイベントなし、`\u003Cscript>` 要素も存在しない） |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 12個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n| 2.4.7 フォーカスの可視化 | 不適合 | 自動判定(Interactive) | 10個中0個でのみフォーカスが視認可能。多くの要素でフォーカスインジケータが不足しています。 |\n| 3.2.1 フォーカス時 | 適合 | 自動判定(Interactive) | 証拠: 10個の要素でフォーカス前後の URL・DOM に変化がないことを確認しました。 |\n| 3.2.2 入力時 | 適合 | 自動判定(Interactive) | 証拠: 5個のフォームフィールド（テキスト入力・select・checkbox / radio）で値の入力・変更前後の URL・DOM に変化がないことを確認しました。 |\n\n### 7. 操作に制限時間を設けない — ✅ 確認OK\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.2.1 タイミング調整可能 | 適合 | 自動判定(Claude) | 制限時間のあるコンテンツがない; 証拠: ng/contact.html に `\u003Cmeta http-equiv=\"refresh\">` も `\u003Cscript>` も存在しない |\n| 2.2.2 一時停止、停止、非表示 | 適合 | 自動判定(Claude) | 自動的に動く・点滅する・自動更新されるコンテンツがない; 証拠: ng/style.css に `animation` / `@keyframes` / `transition` の宣言が存在せず、HTML に `\u003Cmarquee>` も `\u003Cscript>` もない |\n\n### 8. 単一の表現だけで情報を伝えない — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 電話番号欄がラベルと関連付けられておらず、同意チェックボックスが div のためツリーに現れない; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label なし）→ ツリー `- textbox`（名前なし）。同意欄は `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>` で、ツリーには `- text: 個人情報の取り扱いに同意する` しか現れずチェックボックスが存在しない |\n| 1.3.3 感覚的な特徴 | 不適合 | 自動判定(Claude) | 必須項目の指示が「赤字」という色（視覚的特徴）のみに依存している; 証拠: ツリー `- paragraph: 赤字の項目は必須です。` と ng/style.css `.field label.required { color: #b30000; }`（ラベル文字列自体には必須の表記がなく `- textbox \"お名前\"`） |\n| 1.4.1 色の使用 | 不適合 | 自動判定(Claude) | 必須項目を赤い文字色だけで示しており、色を知覚できない利用者に必須かどうかが伝わらない; 証拠: ng/style.css `.field label.required { color: #b30000; }` と HTML `\u003Cp>赤字の項目は必須です。\u003C/p>`、`\u003Clabel for=\"name\" class=\"required\">お名前\u003C/label>`（テキストに「必須」の表記なし） |\n\n### 9. 読み上げ順序が意味の通る順になっている — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 電話番号欄がラベルと関連付けられておらず、同意チェックボックスが div のためツリーに現れない; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label なし）→ ツリー `- textbox`（名前なし）。同意欄は `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>` で、ツリーには `- text: 個人情報の取り扱いに同意する` しか現れずチェックボックスが存在しない |\n| 1.3.2 意味のある順序 | 適合 | 自動判定(Claude) | DOM順（ヘッダー→ナビ→フォーム→フッター）が視覚的な提示順と一致している; 証拠: ツリーが `- heading \"お問い合わせ\" [level=1]` → `- textbox \"お名前\"` → `- textbox \"メールアドレス\"` → `- combobox \"お問い合わせの種類\"` → `- button \"フォーム\": 送信する` の順に並ぶ |\n| 2.4.3 フォーカス順序 | 適合 | 自動判定(Interactive) | 証拠: 12個の要素のフォーカス順序がDOM順序に従っており、論理的です。 |\n\n### 10. 見出し要素でセクションを表現する — ❌ 要修正\n\n> 2.4.10（セクション見出し）は Level AAA のため、A+AA の判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.3.1 情報及び関係性 | 不適合 | 自動判定(Claude) | 電話番号欄がラベルと関連付けられておらず、同意チェックボックスが div のためツリーに現れない; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label なし）→ ツリー `- textbox`（名前なし）。同意欄は `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>` で、ツリーには `- text: 個人情報の取り扱いに同意する` しか現れずチェックボックスが存在しない |\n| 2.4.6 見出し及びラベル | 目視確認 | 要目視確認 |  |\n| 2.4.1 ブロックスキップ | 不適合 | 自動判定(Claude) | ランドマークもスキップリンクも無く、繰り返されるヘッダー・ナビゲーションを読み飛ばす手段がない; 証拠: ツリーに `- banner:` / `- navigation:` / `- main:` / `- contentinfo:` がいずれも現れず（先頭は `- paragraph:`）、HTML はすべて `\u003Cdiv class=\"site-header\">` / `\u003Cdiv class=\"site-nav\">` / `\u003Cdiv class=\"content\">` / `\u003Cdiv class=\"site-footer\">`。`href=\"#main\"` のスキップリンクも存在しない |\n| 2.4.10 | — | 判定対象外 | Level AAA のため A+AA の判定対象外 |\n\n### 11. 文字と背景に十分なコントラスト比 — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.3 コントラスト（最低限） | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（color-contrast）。この pass だけでは適合と判定していません |\n\n### 12. 拡大縮小しても情報が読み取れる — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 1.4.4 テキストのサイズ変更 | 不適合 | 自動判定 | Zooming and scaling must not be disabled（1件） |\n\n### 13. 文字・文字コード・フォントの注意 — ❌ 要修正\n\n> 4.1.1（構文解析）は WCAG 2.2 で廃止されたため判定対象外\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.3.2 ラベル又は説明 | 不適合 | 自動判定(Claude) | 電話番号欄にラベルが関連付けられておらず、必須項目の指示も色のみで示されている; 証拠: HTML `\u003Cspan class=\"field-title\">電話番号\u003C/span>` + `\u003Cinput type=\"tel\" id=\"tel\">`（label 要素なし）→ ツリー `- textbox`（名前なし）。必須の説明は `\u003Cp>赤字の項目は必須です。\u003C/p>` のみ |\n| 4.1.1 | — | 判定対象外 | WCAG 2.2 で廃止 |\n| 4.1.2 名前（name）、役割（role）及び値（value） | 不適合 | 自動判定(Claude) | 名前のない入力欄・ボタンと、役割を持たない擬似チェックボックスがある; 証拠: ツリー `- textbox`（電話番号欄、名前なし）/ `- button`（検索ボタン、名前なし）、HTML `\u003Cdiv class=\"fake-checkbox\" id=\"agree\">\u003C/div>`（role / 状態を持たずツリーに現れない） |\n\n### 14. ページタイトルを適切に表現する — ❌ 要修正\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.2 ページタイトル | 不適合 | 自動判定(Claude) | タイトルが「ページ」で、ページの主題も所属サイトも示していない; 証拠: HTML `\u003Ctitle>ページ\u003C/title>`（同サイトの他ページは「トップページ \\| つばめ台コミュニティセンター」形式） |\n\n### 15. リンクを適切に表現する — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 2.4.4 リンクの目的（コンテキスト内） | 要確認 | 要目視確認 | axe-core は達成基準の一部のみ検証（link-name）。この pass だけでは適合と判定していません |\n\n### 16. ナビゲーションに一貫性をもたせる — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.3 一貫したナビゲーション | 目視確認 | 要目視確認 |  |\n\n### 17. 同じ機能には同じラベルをつける — ⚠️ 一部未確認\n\n| 達成基準 | 状態 | 判定 | 備考 |\n|---|---|---|---|\n| 3.2.4 一貫した識別性 | 目視確認 | 要目視確認 |  |\n\n---\n\n出典: デジタル庁『ウェブアクセシビリティ導入ガイドブック』2024-03-29版 §3.1・§3.2\nhttps://www.digital.go.jp/resources/introduction-to-web-accessibility-guidebook\n\n本ツールはデジタル庁・WAIC・W3C・JISC の認証や推奨を受けたものではありません。"};

  const nav = document.getElementById('nav');
  const content = document.getElementById('content');

  // Map from each page's resolved absolute path to its index, used to route
  // relative .md links found *inside* rendered Markdown (e.g. "./TOP.md")
  // back to loadPage() instead of letting the browser navigate to a URL
  // resolved against index.html's own location (which is the wrong base and
  // 404s, since the .md files actually live under markdown/).
  const pageByPath = new Map();
  let currentDir = '';

  // Build sidebar
  pages.forEach((page, i) => {
    pageByPath.set(new URL(page.file, location.href).pathname, i);

    const a = document.createElement('a');
    a.href = '#';
    a.textContent = page.label;
    a.dataset.index = i;
    if (page.file.includes('_index.md')) {
      a.classList.add('summary-link');
    }
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadPage(i);
    });
    nav.appendChild(a);
  });

  // Intercept clicks on relative .md links inside the rendered content and
  // route them to loadPage() when they match a known page. External links,
  // anchors, and links to files outside the sidebar navigate normally.
  content.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || /^([a-z][a-z0-9+.-]*:|#)/i.test(href)) return;

    let resolvedPath;
    try {
      resolvedPath = new URL(href, new URL(currentDir, location.href)).pathname;
    } catch (err) {
      return;
    }

    const targetIndex = pageByPath.get(resolvedPath);
    if (targetIndex !== undefined) {
      e.preventDefault();
      loadPage(targetIndex);
    }
  });

  function loadPage(index) {
    // Update active state
    nav.querySelectorAll('a').forEach(a => a.classList.remove('active'));
    nav.querySelector(`a[data-index="${index}"]`).classList.add('active');

    const page = pages[index];
    currentDir = page.file.replace(/[^/]*$/, '');
    try {
      const md = pageContents[page.file];
      if (md === undefined) throw new Error('埋め込まれた本文が見つかりません');
      // Render markdown and sanitize to prevent XSS
      const rawHtml = marked.parse(md);
      content.textContent = '';
      const sanitized = DOMPurify.sanitize(rawHtml);
      const wrapper = document.createElement('div');
      wrapper.insertAdjacentHTML('afterbegin', sanitized);
      content.appendChild(wrapper);
    } catch (e) {
      content.textContent = '';
      const errP = document.createElement('p');
      errP.style.color = '#cf222e';
      errP.textContent = '本文の描画に失敗しました: ' + page.file + ' — ' + e.message;
      content.appendChild(errP);
    }
  }

  // Load first page on start
  if (pages.length > 0) {
    loadPage(0);
  } else {
    content.textContent = 'ページが見つかりません。';
  }
</script>

</body>
</html>
